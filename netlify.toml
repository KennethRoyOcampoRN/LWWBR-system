# Spec §3.1 / §11 M0: written now, not deployed until M7 launch. No
# Netlify site exists yet — this configures what M7 will deploy.

[build]
  base = "."
  command = "npm run build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Functions region defaults to us-east-1 (Ohio) on the free tier — see
  # spec §3.1. Moving it to ap-southeast-1 is a paid-plan step done at
  # M7 launch (§11.1 step 2), not something set here.

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Scheduled functions (spec §3.1, §7.4, §8.3) — endpoints ship in M5/M6.
# Registered here so M7 launch is configuration, not construction; inert
# until those functions exist. Netlify scheduled functions run on a cron
# and cannot be invoked over HTTP, so each calls the corresponding
# POST /api/v1/jobs/* endpoint on the api function internally.
[functions."amenity-overdue"]
  schedule = "*/15 * * * *"

# No owner-digest schedule entry here — client decision 8 (spec.md §13):
# the owner monitors live through the Command Center / Owner dashboard
# instead of a scheduled email summary, so POST /api/v1/jobs/owner-digest
# is never wired to fire in production. The endpoint and its supporting
# code (sendOwnerDigest, computeDigestContent, renderDigestEmail) stay in
# the codebase, tested and working — only this schedule registration is
# withheld. Re-adding it later, if decision 8 is revisited, is a single
# entry here, not a rebuild.

# SLA breach is a time-threshold condition, not a user action — same
# 15-minute cadence as amenity-overdue for the same reason (the only way
# to detect "just crossed dueAt" in a serverless app is to check
# periodically). See jobs/service.ts's runExceptionAlertsSweep.
[functions."exception-alerts"]
  schedule = "*/15 * * * *"
