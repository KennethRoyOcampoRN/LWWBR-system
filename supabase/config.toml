# Local Supabase CLI stack (spec §3.1 M0). Hand-authored — NOT generated by
# `supabase init` and NOT verified against a real `supabase start` run in
# this session (no Docker daemon / Supabase CLI available here). If
# `supabase start` rejects this file on your machine, run `supabase init`
# in a scratch directory, diff its output against this file, and reconcile.
# See /README.md "M0 status" for what is and isn't verified.

project_id = "lwwbr-system"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
# Spec §3.1 pins PostgreSQL 16. Unverified: if your Supabase CLI version's
# local image doesn't support 16, it will tell you on `supabase start` —
# drop to 15 and flag the mismatch rather than silently diverging from spec.
major_version = 16

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false

[realtime]
enabled = true

[inbucket]
enabled = false
